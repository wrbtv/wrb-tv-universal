name: Build Linux and macOS

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "functions/**"
      - "public/**"
      - "server.mjs"
      - "build/**"
      - ".github/workflows/build-linux-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Linux DEB and AppImage
        run: npx electron-builder --linux deb AppImage --x64 --publish never
      - name: Validate Linux build
        shell: bash
        run: |
          test -f release/WRB-TV-Player.AppImage
          test -f release/WRB-TV-Player.deb
          test -f release/latest-linux.yml
          ls -lh release
      - name: Publish Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release upload "$TAG" release/WRB-TV-Player.AppImage release/WRB-TV-Player.deb release/latest-linux.yml --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build macOS Universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg zip --universal --publish never
      - name: Validate macOS build
        shell: bash
        run: |
          test -f release/WRB-TV-Player.dmg
          test -f release/WRB-TV-Player.zip
          test -f release/latest-mac.yml
          ls -lh release
      - name: Publish macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release upload "$TAG" release/WRB-TV-Player.dmg release/WRB-TV-Player.zip release/latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber
