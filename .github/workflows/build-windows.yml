name: Build and Publish Windows

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "functions/**"
      - "public/**"
      - "server.mjs"
      - "build/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: cmd
        run: npm install

      - name: Build Windows installer
        shell: cmd
        run: npm run dist:installer -- --publish never

      - name: Validate installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "release/WRB-TV-Player-Setup-$version-x64.exe"
          if (!(Test-Path $exe)) { Write-Error "Installer not found: $exe" }
          if (!(Test-Path "release/latest.yml")) { Write-Error "latest.yml not found in release/" }
          Get-ChildItem release | Select-Object Name, Length

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "WRB-TV Player $version" --notes "WRB-TV Player Windows $version" --latest
          }

          gh release upload $tag "release/WRB-TV-Player-Setup-$version-x64.exe" "release/latest.yml" --repo $env:GITHUB_REPOSITORY --clobber
